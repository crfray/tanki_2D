# Локальный запуск игры в контейнере — для разработки и тестирования.
#
# Почему так, а не Dockerfile со сборкой образа:
#   игра — статический HTML. Собирать образ на каждую правку незачем.
#   Берём стоковый nginx и МОНТИРУЕМ папку проекта внутрь как том.
#   Правишь tanki.html в редакторе → жмёшь F5 в браузере → видишь
#   изменение. Пересборка не нужна. Это и есть верный выбор для статики.
#
# Запуск:   docker compose up -d
# Открыть:  http://localhost:8080/tanki.html
# Логи:     docker compose logs -f
# Стоп:     docker compose down
#
# Важно: игра при этом НЕ перестаёт открываться двойным кликом из файла —
# контейнер это просто ещё один способ запустить, а не замена принципу.

services:
  game:
    image: nginx:alpine            # лёгкий готовый веб-сервер, ничего не собираем
    container_name: tanki-2d
    ports:
      - "8080:80"                  # хост:контейнер — снаружи 8080, внутри nginx на 80
    volumes:
      # Монтируем весь проект только на чтение (:ro). nginx отдаёт файлы
      # из /usr/share/nginx/html — кладём туда содержимое папки проекта.
      # :ro = контейнер не может ничего у нас перезаписать.
      - ./:/usr/share/nginx/html:ro
    restart: unless-stopped        # поднимется снова после перезагрузки, пока сам не остановишь
